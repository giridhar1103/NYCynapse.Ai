models:
  - name: service_requests
    table: gold.fct_service_request
    workspace: city_services
    label: 311 service requests
    grain: one row per request
    coverage: [requests_311]
    synonyms: ["311", complaints, service requests, 311 calls]
    time:
      - {name: created, instant: created_at, local_date: created_date, local_hour: created_hour, default: true}
      - {name: closed, instant: closed_at}
    entities:
      - {name: neighborhood, column: nta_code}
      - {name: community_district, column: community_district}
      - {name: borough, column: boro_code}
      - {name: taxi_zone, column: taxi_zone_id}
      - {name: created_date, column: created_date}
    dimensions:
      - {name: complaint_type, column: complaint_type, values: index,
         synonyms: [complaint, problem, issue, category]}
      - {name: descriptor, column: descriptor, values: index, synonyms: [complaint detail, subtype]}
      - {name: agency, column: agency, values: enumerate, synonyms: [department]}
      - {name: agency_name, column: agency_name, values: enumerate}
      - {name: status, column: status, values: enumerate}
      - {name: is_closed, column: is_closed, kind: boolean, synonyms: [resolved]}
      - {name: channel, column: channel, values: enumerate, synonyms: [submitted by, phone, app]}
      - {name: location_type, column: location_type, values: index}
      - {name: borough, column: borough, values: enumerate, geo_level: borough}
      - {name: zip_code, column: incident_zip, values: index, synonyms: [zip, zip code, postcode, postal code],
         description: "ZIP code of the address as reported. Use this for questions naming a ZIP code."}
      - {name: police_precinct, column: police_precinct, kind: numeric, geo_level: police_precinct, synonyms: [precinct]}
      - {name: council_district, column: council_district, kind: numeric, geo_level: council_district}
      - {name: zip_area, column: modzcta, values: none, geo_level: zip_area, synonyms: [ZCTA, MODZCTA],
         description: "Modified ZIP code tabulation area, the health department's grouping of ZIP codes. Not the ZIP code itself; use zip_code for a named ZIP."}
      - {name: created_hour, column: created_hour, kind: numeric}
      - {name: descriptor_2, column: descriptor_2, values: index, description: "Third level of detail, when used."}
      - {name: close_hours, column: hours_to_close, kind: numeric, synonyms: [hours to close, time to close, resolution time], description: "Hours from filing to closing. Empty while open."}
      - {name: street_name, column: street_name, values: index, synonyms: [street], description: "Street name given."}
    measures:
      - {name: requests, expr: "*", agg: count}
      - {name: hours_to_close, expr: hours_to_close, agg: avg}
