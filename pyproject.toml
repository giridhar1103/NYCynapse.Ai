[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nycynapse"
version = "0.1.0"
description = "Natural language questions over the NYCynapse lake: semantic layer, query planning, evaluation"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6",
    "sqlglot>=26",
    "psycopg[binary]>=3.2",
    "duckdb>=1.5.2,<1.6",
    "pytz",
    "langgraph>=1.0",
    "fastembed>=0.7,<0.8",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
mcp = ["mcp>=2.3"]

[project.scripts]
nycynapse = "nycynapse.cli:main"
nycynapse-mcp = "nycynapse.mcp_server:main"

[tool.setuptools.package-data]
nycynapse = ["prompts/*.md", "catalog/migrations/*.sql"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
