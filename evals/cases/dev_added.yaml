- id: d2-026
  question: What was the percentage change in weekend subway entries at Union Sq-14 St from April 2025
    to April 2026?
  category: geographic
  difficulty: medium
  split: dev
  source: question by GPT-6-Astra, reference by Claude Opus 5.5
  group: d2g-006
  gold_sql: |
    WITH t AS (
      SELECT
        SUM(riders) FILTER (WHERE hour_start >= timezone('America/New_York', TIMESTAMP '2025-04-01')
                              AND hour_start <  timezone('America/New_York', TIMESTAMP '2025-05-01')) AS riders_apr_2025,
        SUM(riders) FILTER (WHERE hour_start >= timezone('America/New_York', TIMESTAMP '2026-04-01')
                              AND hour_start <  timezone('America/New_York', TIMESTAMP '2026-05-01')) AS riders_apr_2026
      FROM gold.fct_subway_ridership_hourly
      WHERE complex_name ILIKE '%Union Sq%'
        AND transit_mode = 'subway'
        AND isodow(hour_at_local) IN (6, 7)
        AND ((hour_start >= timezone('America/New_York', TIMESTAMP '2025-04-01')
              AND hour_start < timezone('America/New_York', TIMESTAMP '2025-05-01'))
          OR (hour_start >= timezone('America/New_York', TIMESTAMP '2026-04-01')
              AND hour_start < timezone('America/New_York', TIMESTAMP '2026-05-01')))
    )
    SELECT (riders_apr_2026 - riders_apr_2025) / riders_apr_2025 * 100 AS pct_change,
           riders_apr_2025,
           riders_apr_2026
    FROM t
  notes: Resolves the station complex and compares total weekend entries across two fully covered months.
