- id: d2-003
  question: Which Manhattan taxi zone had the highest ratio of Citi Bike departures to yellow taxi pickups
    in August 2026?
  category: cross_domain
  difficulty: hard
  split: dev
  source: question by GPT-6-Astra, reference by Claude Opus 5.5
  gold_sql: |
    WITH bike AS (
      SELECT start_taxi_zone_id AS zone_id, COUNT(*) AS bike_rides
      FROM gold.fct_bike_trip
      WHERE started_at >= timezone('America/New_York', TIMESTAMP '2026-08-01')
        AND started_at <  timezone('America/New_York', TIMESTAMP '2026-09-01')
        AND file_month = DATE '2026-08-01'
        AND duration_minutes BETWEEN 1 AND 240
      GROUP BY 1
    ), taxi AS (
      SELECT pickup_zone_id AS zone_id, SUM(trips) AS taxi_trips
      FROM gold.agg_trips_zone_hourly
      WHERE service = 'yellow'
        AND file_month = DATE '2026-08-01'
        AND pickup_date >= DATE '2026-08-01'
        AND pickup_date <  DATE '2026-09-01'
      GROUP BY 1
    )
    SELECT z.zone_name,
           b.bike_rides::DOUBLE / t.taxi_trips AS bike_to_taxi_ratio
    FROM gold.dim_taxi_zone z
    JOIN bike b ON b.zone_id = z.zone_id
    JOIN taxi t ON t.zone_id = z.zone_id
    WHERE z.borough = 'Manhattan'
      AND t.taxi_trips > 0
    ORDER BY bike_to_taxi_ratio DESC
    LIMIT 1
  notes: Combines bike departures and plausible taxi pickups at the same geographic scale, then ranks
    their ratios.
- id: d2-004
  question: Were average app pickup waits in Queens longer during hours with snowfall than hours without
    snowfall in January 2025?
  category: cross_domain
  difficulty: hard
  split: dev
  source: question by GPT-6-Astra, reference by Claude Opus 5.5
  gold_sql: |
    SELECT w.is_snow_hour,
           SUM(a.wait_minutes_sum) / SUM(a.trips_with_wait) AS avg_app_wait_minutes
    FROM gold.agg_trips_zone_hourly a
    JOIN gold.dim_taxi_zone z ON z.zone_id = a.pickup_zone_id
    JOIN gold.fct_weather_hourly w
      ON w.boro_code = 4
     AND w.hour_date = a.pickup_date
     AND w.hour_hour = a.pickup_hour
    WHERE z.borough = 'Queens'
      AND a.service IN ('uber', 'lyft', 'via', 'juno')
      AND a.file_month = DATE '2025-01-01'
      AND a.pickup_date >= DATE '2025-01-01'
      AND a.pickup_date < DATE '2025-02-01'
      AND w.hour_start >= timezone('America/New_York', TIMESTAMP '2025-01-01')
      AND w.hour_start < timezone('America/New_York', TIMESTAMP '2025-02-01')
    GROUP BY w.is_snow_hour
  notes: Matches pickup-zone boroughs and hours to weather, then computes trip-weighted waits using known
    waits.
- id: d2-005
  question: In 2025, what share of Queens crashes occurred during hours when monitored roads in Queens
    averaged below 20 mph?
  category: cross_domain
  difficulty: hard
  split: dev
  source: question by GPT-6-Astra, reference by Claude Opus 5.5
  gold_sql: |
    WITH queens_hourly_speed AS (
      SELECT s.observed_date, s.observed_hour, AVG(s.speed_mph) AS avg_speed
      FROM gold.fct_traffic_speed s
      JOIN gold.dim_traffic_link l ON l.link_id = s.link_id
      WHERE s.is_valid
        AND upper(l.borough) = 'QUEENS'
        AND s.observed_at >= timezone('America/New_York', TIMESTAMP '2025-01-01')
        AND s.observed_at <  timezone('America/New_York', TIMESTAMP '2026-01-01')
      GROUP BY s.observed_date, s.observed_hour
    ),
    queens_crashes AS (
      SELECT c.collision_id, c.crash_date, c.crash_hour
      FROM gold.fct_collision c
      WHERE upper(c.borough) = 'QUEENS'
        AND c.crashed_at >= timezone('America/New_York', TIMESTAMP '2025-01-01')
        AND c.crashed_at <  timezone('America/New_York', TIMESTAMP '2026-01-01')
    )
    SELECT
      COUNT(*) FILTER (WHERE h.avg_speed < 20)::DOUBLE / COUNT(*) AS share_of_crashes_in_slow_hours
    FROM queens_crashes q
    LEFT JOIN queens_hourly_speed h
      ON h.observed_date = q.crash_date AND h.observed_hour = q.crash_hour
  notes: Aggregates valid speed readings by borough-hour before matching crashes and calculating their
    share.
- id: d2-006
  question: How many Bronx heat and hot water complaints were filed during hours below freezing in January
    2026?
  category: cross_domain
  difficulty: medium
  split: dev
  source: question by GPT-6-Astra, reference by Claude Opus 5.5
  group: d2g-002
  gold_sql: |
    SELECT count(*) AS heat_hot_water_requests
    FROM gold.fct_service_request r
    JOIN gold.fct_weather_hourly w
      ON w.boro_code = 2
     AND w.hour_date = r.created_date
     AND w.hour_hour = r.created_hour
    WHERE r.complaint_type = 'HEAT/HOT WATER'
      AND r.boro_code = 2
      AND r.created_at >= timezone('America/New_York', TIMESTAMP '2026-01-01')
      AND r.created_at <  timezone('America/New_York', TIMESTAMP '2026-02-01')
      AND w.temperature_f < 32
  notes: Grounds the complaint category and matches filing hours to Bronx temperatures below 32°F.
