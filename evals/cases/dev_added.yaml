- id: d2-042
  question: Which subway line had the most service alerts on days when the city received over 100 street
    flooding complaints in 2026?
  category: cross_domain
  difficulty: hard
  split: dev
  source: question by Gemini 3.1 Pro, reference by Claude Opus 5.5
  group: d2g-010
  gold_sql: |
    WITH flood_days AS (
      SELECT created_date AS d
      FROM gold.fct_service_request
      WHERE created_at >= timezone('America/New_York', TIMESTAMP '2026-01-01')
        AND created_at <  timezone('America/New_York', TIMESTAMP '2027-01-01')
        AND (complaint_type ILIKE '%street flood%' OR descriptor ILIKE '%street flood%' OR descriptor_2 ILIKE '%street flood%')
      GROUP BY created_date
      HAVING count(*) > 100
    ),
    day_bounds AS (
      SELECT d,
             timezone('America/New_York', CAST(d AS TIMESTAMP)) AS day_start,
             timezone('America/New_York', CAST(d AS TIMESTAMP) + INTERVAL 1 DAY) AS day_end
      FROM flood_days
    ),
    alert_spans AS (
      SELECT alert_id,
             route_ids,
             coalesce(first_active_at, created_at, first_seen_at) AS span_start,
             coalesce(last_active_at, last_seen_at) AS span_end
      FROM gold.fct_subway_alert
    ),
    alert_routes AS (
      SELECT alert_id, span_start, span_end, unnest(route_ids) AS route_id
      FROM alert_spans
    )
    SELECT ar.route_id, count(DISTINCT ar.alert_id) AS alerts
    FROM alert_routes ar
    JOIN day_bounds db
      ON ar.span_start < db.day_end
     AND ar.span_end >= db.day_start
    GROUP BY ar.route_id
    QUALIFY rank() OVER (ORDER BY count(DISTINCT ar.alert_id) DESC) = 1
  notes: Joins subway alerts with daily counts of 311 street flooding complaints.
