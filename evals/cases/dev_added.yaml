- id: d2-067
  question: Which month in 2025 had the biggest difference between weekday and weekend average daily Citi
    Bike rides?
  category: temporal
  difficulty: hard
  split: dev
  source: question by Gemini 3.1 Pro, reference by Claude Opus 5.5
  group: d2g-020
  gold_sql: |
    WITH rides AS (
      SELECT start_date, count(*) AS n
      FROM gold.fct_bike_trip
      WHERE started_at >= timezone('America/New_York', TIMESTAMP '2025-01-01')
        AND started_at < timezone('America/New_York', TIMESTAMP '2026-01-01')
        AND file_month BETWEEN DATE '2025-01-01' AND DATE '2025-12-01'
        AND duration_minutes >= 1 AND duration_minutes <= 240
      GROUP BY start_date
    ), days AS (
      SELECT d.month_start, d.is_weekend, coalesce(r.n, 0) AS n
      FROM gold.dim_date d
      LEFT JOIN rides r ON r.start_date = d.date
      WHERE d.year = 2025
    ), m AS (
      SELECT month_start,
             avg(n) FILTER (WHERE NOT is_weekend) AS weekday_avg,
             avg(n) FILTER (WHERE is_weekend) AS weekend_avg
      FROM days
      GROUP BY month_start
    )
    SELECT month_start AS month,
           weekday_avg - weekend_avg AS weekday_minus_weekend_avg_daily_rides
    FROM m
    ORDER BY abs(weekday_avg - weekend_avg) DESC
    LIMIT 1
  notes: Requires calculating and comparing metrics split by weekday/weekend for every month.
