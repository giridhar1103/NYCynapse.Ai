- id: d2-025
  question: How many Citi Bike rides started in Washington Heights and ended in Harlem in July 2026?
  category: geographic
  difficulty: hard
  split: dev
  source: question by GPT-6-Astra, reference by Claude Opus 5.5
  gold_sql: |
    SELECT COUNT(*) AS bike_rides
    FROM gold.fct_bike_trip t
    WHERE t.started_at >= timezone('America/New_York', TIMESTAMP '2026-07-01')
      AND t.started_at <  timezone('America/New_York', TIMESTAMP '2026-08-01')
