- id: d2-048
  question: How much in tips did yellow cab drivers make on trips starting at JFK and ending in Williamsburg
    in 2025?
  category: multi_join
  difficulty: medium
  split: dev
  source: question by Gemini 3.1 Pro, reference by Claude Opus 5.5
  gold_sql: |
    SELECT SUM(t.tip_usd) AS total_tips_usd
    FROM gold.fct_taxi_trip t
    JOIN gold.dim_taxi_zone pz ON t.pickup_zone_id = pz.zone_id
    JOIN gold.dim_taxi_zone dz ON t.dropoff_zone_id = dz.zone_id
    WHERE t.taxi_type = 'yellow'
      AND t.is_plausible
      AND t.payment_type = 'credit card'
      AND pz.zone_name = 'JFK Airport'
      AND dz.zone_name LIKE 'Williamsburg%'
      AND t.pickup_at >= timezone('America/New_York', TIMESTAMP '2025-01-01')
      AND t.pickup_at < timezone('America/New_York', TIMESTAMP '2026-01-01')
      AND t.file_month >= DATE '2025-01-01'
      AND t.file_month < DATE '2026-01-01'
