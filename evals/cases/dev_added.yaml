- id: d2-062
  question: Did more Uber and Lyft trips drop off in Central Park or Prospect Park in summer 2025?
  category: geographic
  difficulty: hard
  split: dev
  source: question by Gemini 3.1 Pro, reference by Claude Opus 5.5
  gold_sql: |
    SELECT z.zone_name, COUNT(*) AS trips
    FROM gold.fct_rideshare_trip t
    JOIN gold.dim_taxi_zone z ON z.zone_id = t.dropoff_zone_id
    WHERE z.zone_name IN ('Central Park', 'Prospect Park')
      AND t.company IN ('Uber', 'Lyft')
      AND t.is_plausible
      AND t.pickup_at >= timezone('America/New_York', TIMESTAMP '2025-06-01')
      AND t.pickup_at < timezone('America/New_York', TIMESTAMP '2025-09-01')
      AND t.file_month BETWEEN DATE '2025-06-01' AND DATE '2025-08-01'
    GROUP BY z.zone_name
  notes: Compares trip counts for two specific named geographic zones.
- id: d2-063
  question: What was the busiest subway station complex in the Bronx for weekend ridership in 2025?
  category: geographic
  difficulty: medium
  split: dev
  source: question by Gemini 3.1 Pro, reference by Claude Opus 5.5
  gold_sql: |
    SELECT any_value(complex_name) AS complex_name, SUM(riders) AS weekend_riders
    FROM gold.fct_subway_ridership_hourly
    WHERE hour_start >= timezone('America/New_York', TIMESTAMP '2025-01-01')
      AND hour_start < timezone('America/New_York', TIMESTAMP '2026-01-01')
      AND transit_mode = 'subway'
      AND borough = 'Bronx'
      AND isodow(hour_date) IN (6, 7)
    GROUP BY complex_id
    ORDER BY weekend_riders DESC
    LIMIT 1
  notes: Ranks subway stations within a specific borough based on weekend usage.
- id: d2-064
  question: Which 2025 date had the worst rush hour speeds on the Brooklyn-Queens Expressway?
  category: grounding
  difficulty: medium
  split: dev
  source: question by Gemini 3.1 Pro, reference by Claude Opus 5.5
  group: d2g-019
  gold_sql: |
    SELECT s.observed_date AS worst_date,
           AVG(s.speed_mph) AS avg_speed_mph
    FROM gold.fct_traffic_speed s
    JOIN gold.dim_traffic_link l ON l.link_id = s.link_id
    WHERE (l.link_name ILIKE 'BQE%' OR l.link_name ILIKE 'BROOKLYN QUEENS EXP%' OR l.link_name ILIKE 'BROOKLYN-QUEENS EXP%')
      AND s.is_valid
      AND s.observed_at >= timezone('America/New_York', TIMESTAMP '2025-01-01')
      AND s.observed_at <  timezone('America/New_York', TIMESTAMP '2026-01-01')
      AND isodow(s.observed_date) BETWEEN 1 AND 5
      AND (s.observed_hour BETWEEN 7 AND 9 OR s.observed_hour BETWEEN 16 AND 18)
    GROUP BY s.observed_date
    ORDER BY avg_speed_mph ASC
    LIMIT 1
  notes: Requires mapping 'Brooklyn-Queens Expressway' or 'BQE' to road links and 'worst' to minimum speed.
