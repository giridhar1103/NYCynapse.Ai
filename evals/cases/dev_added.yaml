# Added 2026-10-06. Questions drafted by GPT-6-Astra and Gemini 3.1 Pro, references by Claude
# Opus 5.5, then audited by three models and reviewed by hand. See evals/audit/DECISIONS.md.
cases:
- id: d2-001
  question: In July 2025, how did Brooklyn's average subway entries per hour compare between hours at
    least 90°F and cooler hours?
  category: cross_domain
  difficulty: hard
  split: dev
  source: question by GPT-6-Astra, reference by Claude Opus 5.5
  group: d2g-001
  gold_sql: |
    WITH w AS (
      SELECT hour_start, temperature_f >= 90 AS is_hot
      FROM gold.fct_weather_hourly
      WHERE boro_code = 3
        AND temperature_f IS NOT NULL
        AND hour_start >= timezone('America/New_York', TIMESTAMP '2025-07-01')
        AND hour_start <  timezone('America/New_York', TIMESTAMP '2025-08-01')
    ),
    r AS (
      SELECT hour_start, SUM(riders) AS riders
      FROM gold.fct_subway_ridership_hourly
      WHERE borough = 'Brooklyn'
        AND transit_mode = 'subway'
        AND hour_start >= timezone('America/New_York', TIMESTAMP '2025-07-01')
        AND hour_start <  timezone('America/New_York', TIMESTAMP '2025-08-01')
      GROUP BY hour_start
    )
    SELECT CASE WHEN w.is_hot THEN '90F or hotter' ELSE 'cooler' END AS temperature_group,
           SUM(COALESCE(r.riders, 0)) / COUNT(*) AS avg_entries_per_hour
    FROM w
    LEFT JOIN r ON r.hour_start = w.hour_start
    GROUP BY 1
  notes: Matches ridership to Brooklyn weather by hour and divides each group's entries by its number
    of hours.
