- id: d2-069
  question: What share of yellow cab pickups in 2024 happened during the evening rush hour?
  category: temporal
  difficulty: medium
  split: dev
  source: question by Gemini 3.1 Pro, reference by Claude Opus 5.5
  gold_sql: |
    SELECT SUM(trips) FILTER (WHERE isodow(pickup_date) BETWEEN 1 AND 5 AND pickup_hour BETWEEN 16 AND 18)::DOUBLE / SUM(trips) AS evening_rush_share
    FROM gold.agg_trips_zone_hourly
    WHERE service = 'yellow'
      AND pickup_date >= DATE '2024-01-01' AND pickup_date < DATE '2025-01-01'
      AND file_month >= DATE '2024-01-01' AND file_month < DATE '2025-01-01'
  notes: Computes a percentage based on the named time period 'evening rush hour'.
