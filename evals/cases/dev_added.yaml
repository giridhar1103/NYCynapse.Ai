        AND isodow(hour_at_local) IN (6, 7)
        AND ((hour_start >= timezone('America/New_York', TIMESTAMP '2025-04-01')
              AND hour_start < timezone('America/New_York', TIMESTAMP '2025-05-01'))
          OR (hour_start >= timezone('America/New_York', TIMESTAMP '2026-04-01')
              AND hour_start < timezone('America/New_York', TIMESTAMP '2026-05-01')))
    )
    SELECT (riders_apr_2026 - riders_apr_2025) / riders_apr_2025 * 100 AS pct_change,
           riders_apr_2025,
           riders_apr_2026
    FROM t
  notes: Resolves the station complex and compares total weekend entries across two fully covered months.
