- id: d2-016
  question: Which Queens monitored road links averaged under 15 mph in the last two hours?
  category: live
  difficulty: medium
  split: dev
  source: question by GPT-6-Astra, reference by Claude Opus 5.5
  gold_sql: |
    SELECT l.link_id, l.link_name, AVG(s.speed_mph) AS avg_speed_mph
    FROM gold.fct_traffic_speed s
    JOIN gold.dim_traffic_link l ON l.link_id = s.link_id
    WHERE l.borough = 'Queens'
      AND s.is_valid
      AND s.observed_at >= timezone('America/New_York', TIMESTAMP '2026-10-03 04:00:00')
      AND s.observed_at < timezone('America/New_York', TIMESTAMP '2026-10-03 06:00:00')
    GROUP BY l.link_id, l.link_name
    HAVING AVG(s.speed_mph) < 15
  notes: Joins road locations to valid readings between 4 a.m. and 6 a.m. on October 3.
