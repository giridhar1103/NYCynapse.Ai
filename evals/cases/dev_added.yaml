- id: d2-008
  question: Which borough had the most pedestrians under 18 injured in crashes during 2025?
  category: multi_join
  difficulty: medium
  split: dev
  source: question by GPT-6-Astra, reference by Claude Opus 5.5
  gold_sql: |
    SELECT c.borough, COUNT(*) AS pedestrians_under_18_injured
    FROM gold.fct_collision_person p
    JOIN gold.fct_collision c ON c.collision_id = p.collision_id
    WHERE c.crashed_at >= timezone('America/New_York', TIMESTAMP '2025-01-01')
      AND c.crashed_at < timezone('America/New_York', TIMESTAMP '2026-01-01')
      AND p.person_type = 'pedestrian'
      AND p.was_injured
      AND p.age < 18
      AND c.borough IS NOT NULL
    GROUP BY c.borough
    ORDER BY pedestrians_under_18_injured DESC
    LIMIT 1
  notes: Joins person-level ages and injuries to crash locations, then ranks boroughs.
- id: d2-009
  question: For each pickup borough, which destination borough received the most green taxi rides in June
    2026?
  category: multi_join
  difficulty: hard
  split: dev
  source: question by GPT-6-Astra, reference by Claude Opus 5.5
  gold_sql: |
    SELECT pz.borough AS pickup_borough, dz.borough AS dropoff_borough, count(*) AS rides
    FROM gold.fct_taxi_trip t
    JOIN gold.dim_taxi_zone pz ON t.pickup_zone_id = pz.zone_id
    JOIN gold.dim_taxi_zone dz ON t.dropoff_zone_id = dz.zone_id
    WHERE t.taxi_type = 'green'
      AND t.is_plausible
      AND t.file_month = DATE '2026-06-01'
      AND t.pickup_at >= timezone('America/New_York', TIMESTAMP '2026-06-01')
      AND t.pickup_at < timezone('America/New_York', TIMESTAMP '2026-07-01')
      AND pz.borough IS NOT NULL AND pz.borough <> ''
      AND dz.borough IS NOT NULL AND dz.borough <> ''
    GROUP BY pz.borough, dz.borough
    QUALIFY rank() OVER (PARTITION BY pz.borough ORDER BY count(*) DESC) = 1
  notes: Resolves both trip endpoints through taxi zones and ranks destination boroughs within each pickup
    borough.
- id: d2-010
  question: Which residential neighborhood in each borough had the most subway entries at accessible station
    complexes in April 2026?
  category: multi_join
  difficulty: hard
  split: dev
  source: question by GPT-6-Astra, reference by Claude Opus 5.5
  gold_sql: |
    WITH nta_riders AS (
      SELECT n.borough, n.nta_code, n.nta_name, SUM(r.riders) AS riders
      FROM gold.fct_subway_ridership_hourly r
      JOIN gold.dim_subway_complex c ON c.complex_id = r.complex_id
      JOIN gold.dim_neighborhood n ON n.nta_code = c.nta_code
      WHERE r.hour_start >= timezone('America/New_York', TIMESTAMP '2026-04-01')
        AND r.hour_start < timezone('America/New_York', TIMESTAMP '2026-05-01')
        AND r.transit_mode = 'subway'
        AND c.is_accessible
        AND n.is_residential
      GROUP BY n.borough, n.nta_code, n.nta_name
    )
    SELECT nta_name, borough, riders
    FROM nta_riders
    QUALIFY ROW_NUMBER() OVER (PARTITION BY borough ORDER BY riders DESC) = 1
  notes: Joins entries to complex accessibility and residential neighborhoods, then ranks neighborhoods
    within boroughs.
- id: d2-011
  question: What share of NYC Citi Bike departures in August 2026 came from stations equipped to charge
    e-bikes?
  category: multi_join
  difficulty: medium
  split: dev
  source: question by GPT-6-Astra, reference by Claude Opus 5.5
  group: d2g-003
  gold_sql: |
    SELECT
      AVG(CASE WHEN COALESCE(s.has_charging, FALSE) THEN 1.0 ELSE 0.0 END) AS charging_station_departure_share
    FROM gold.fct_bike_trip t
    JOIN gold.dim_bike_station s
      ON t.start_station_number = s.station_number
    WHERE t.file_month = DATE '2026-08-01'
      AND t.started_at >= timezone('America/New_York', TIMESTAMP '2026-08-01')
      AND t.started_at <  timezone('America/New_York', TIMESTAMP '2026-09-01')
      AND t.duration_minutes >= 1
      AND t.duration_minutes <= 240
      AND NOT COALESCE(s.is_new_jersey, FALSE)
  notes: Links ride departure stations to charging capabilities and excludes New Jersey departures.
