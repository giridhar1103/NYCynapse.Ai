- id: d2-054
  question: Which table is the most stale in the data lake at the moment?
  category: live
  difficulty: easy
  split: dev
  source: question by Gemini 3.1 Pro, reference by Claude Opus 5.5
  group: d2g-015
  gold_sql: |
    WITH latest AS (
      SELECT table_name, last_success_at
      FROM gold.ops_source_freshness
      QUALIFY row_number() OVER (PARTITION BY table_name ORDER BY checked_at DESC) = 1
    )
    SELECT table_name, last_success_at
    FROM latest
    WHERE last_success_at IS NOT NULL
    ORDER BY last_success_at ASC
    LIMIT 1
  notes: Queries the pipeline operations table for the latest freshness status.
