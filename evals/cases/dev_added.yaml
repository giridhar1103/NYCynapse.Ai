- id: d2-013
  question: Which Bronx Citi Bike stations are renting bikes and have at least three e-bikes available
    right now?
  category: live
  difficulty: medium
  split: dev
  source: question by GPT-6-Astra, reference by Claude Opus 5.5
  gold_sql: |
    WITH latest AS (
      SELECT s.*
      FROM gold.fct_bike_station_status s
      WHERE s.reported_at <= timezone('America/New_York', TIMESTAMP '2026-10-03 06:00:00')
      QUALIFY row_number() OVER (PARTITION BY s.station_id ORDER BY s.reported_at DESC) = 1
    )
    SELECT d.station_name, l.ebikes_available
    FROM latest l
    JOIN gold.dim_bike_station d ON d.station_id = l.station_id
    WHERE d.boro_code = 2
      AND l.is_renting
      AND l.ebikes_available >= 3
  notes: Uses each station's latest status at or before the specified now and filters borough, rental
    status, and availability.
- id: d2-014
  question: Since midnight today, what share of scheduled F train arrivals were more than five minutes
    late?
  category: live
  difficulty: medium
  split: dev
  source: question by GPT-6-Astra, reference by Claude Opus 5.5
  group: d2g-004
  gold_sql: |
    SELECT COUNT(*) FILTER (WHERE delay_seconds > 300)::DOUBLE / COUNT(*) AS late_share
    FROM gold.fct_subway_arrival
    WHERE route_id = 'F'
      AND is_scheduled_trip
      AND delay_seconds IS NOT NULL
      AND arrived_at >= timezone('America/New_York', TIMESTAMP '2026-10-03 00:00:00')
      AND arrived_at <  timezone('America/New_York', TIMESTAMP '2026-10-03 06:00:00')
  notes: Uses observed scheduled arrivals from midnight to 6 a.m. on October 3 and the governed lateness
    threshold.
