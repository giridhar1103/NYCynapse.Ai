- id: d2-024
  question: What share of 311 requests filed in ZIP code 10453 during February 2026 concerned heat or
    hot water?
  category: geographic
  difficulty: medium
  split: dev
  source: question by GPT-6-Astra, reference by Claude Opus 5.5
  gold_sql: |
    SELECT
      avg(CASE WHEN upper(complaint_type) = 'HEAT/HOT WATER' THEN 1.0 ELSE 0.0 END) AS heat_hot_water_share
