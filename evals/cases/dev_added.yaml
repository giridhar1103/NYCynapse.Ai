- id: d2-038
  question: What was the average traffic speed on Brooklyn highways during hours that had fatal crashes
    in 2025?
  category: cross_domain
  difficulty: hard
  split: dev
  source: question by Gemini 3.1 Pro, reference by Claude Opus 5.5
  gold_sql: |
    WITH fatal_hours AS (
      SELECT DISTINCT crash_date, crash_hour
      FROM gold.fct_collision
      WHERE has_fatality
        AND boro_code = 3
        AND crashed_at >= timezone('America/New_York', TIMESTAMP '2025-01-01')
        AND crashed_at <  timezone('America/New_York', TIMESTAMP '2026-01-01')
    )
    SELECT AVG(s.speed_mph) AS avg_road_speed_mph
    FROM gold.fct_traffic_speed s
    JOIN gold.dim_traffic_link l ON l.link_id = s.link_id
    JOIN fatal_hours f ON s.observed_date = f.crash_date AND s.observed_hour = f.crash_hour
    WHERE s.is_valid
      AND upper(l.borough) = 'BROOKLYN'
      AND s.observed_at >= timezone('America/New_York', TIMESTAMP '2025-01-01')
      AND s.observed_at <  timezone('America/New_York', TIMESTAMP '2026-01-01')
  notes: Joins hourly traffic speeds with crash times and locations.
- id: d2-039
  question: What was the total subway ridership on the ten days with the most Citi Bike rides in 2024?
  category: cross_domain
  difficulty: hard
  split: dev
  source: question by Gemini 3.1 Pro, reference by Claude Opus 5.5
  gold_sql: |
    WITH bike_days AS (
      SELECT start_date, COUNT(*) AS rides
      FROM gold.fct_bike_trip
      WHERE started_at >= timezone('America/New_York', TIMESTAMP '2024-01-01')
        AND started_at < timezone('America/New_York', TIMESTAMP '2025-01-01')
        AND file_month BETWEEN DATE '2023-12-01' AND DATE '2025-01-01'
