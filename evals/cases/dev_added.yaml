- id: d2-031
  question: In 2025, which month had the largest absolute difference between morning-rush and evening-rush
    subway entries?
  category: temporal
  difficulty: hard
  split: dev
  source: question by GPT-6-Astra, reference by Claude Opus 5.5
  gold_sql: |
    SELECT date_trunc('month', hour_date) AS month,
           abs(SUM(CASE WHEN hour_hour BETWEEN 7 AND 9 THEN riders ELSE 0 END)
             - SUM(CASE WHEN hour_hour BETWEEN 16 AND 18 THEN riders ELSE 0 END)) AS abs_rush_difference
    FROM gold.fct_subway_ridership_hourly
    WHERE hour_start >= timezone('America/New_York', TIMESTAMP '2025-01-01')
      AND hour_start <  timezone('America/New_York', TIMESTAMP '2026-01-01')
      AND transit_mode = 'subway'
      AND isodow(hour_date) BETWEEN 1 AND 5
      AND (hour_hour BETWEEN 7 AND 9 OR hour_hour BETWEEN 16 AND 18)
    GROUP BY 1
    ORDER BY abs_rush_difference DESC
    LIMIT 1
  notes: Applies both weekday rush windows, calculates monthly totals, and ranks the absolute differences.
- id: d2-032
  question: How did average overnight yellow taxi trip distance differ between weekdays and weekends in
    February 2026?
  category: temporal
  difficulty: medium
  split: dev
  source: question by GPT-6-Astra, reference by Claude Opus 5.5
  gold_sql: |
    SELECT CASE WHEN d.is_weekend THEN 'weekend' ELSE 'weekday' END AS day_type,
           SUM(a.trip_miles_sum) / SUM(a.trips) AS avg_trip_miles
    FROM gold.agg_trips_zone_hourly a
    JOIN gold.dim_date d ON d.date = a.pickup_date
    WHERE a.service = 'yellow'
      AND a.file_month = DATE '2026-02-01'
      AND a.pickup_date >= DATE '2026-02-01'
      AND a.pickup_date < DATE '2026-03-01'
      AND a.pickup_hour BETWEEN 0 AND 5
    GROUP BY 1
  notes: Combines the midnight-to-6 a.m. window with weekday classifications and computes trip-weighted
    distances.
- id: d2-033
