    SELECT b.borough, COUNT(*) AS rides
    FROM gold.fct_bike_trip t
    JOIN gold.dim_bike_station s ON t.end_station_number = s.station_number
    JOIN gold.dim_borough b ON t.end_boro_code = b.boro_code
    WHERE t.started_at >= timezone('America/New_York', TIMESTAMP '2025-01-01')
      AND t.started_at < timezone('America/New_York', TIMESTAMP '2026-01-01')
      AND t.file_month >= DATE '2025-01-01' AND t.file_month <= DATE '2025-12-01'
      AND t.bike_type = 'classic_bike'
      AND s.has_charging
      AND t.duration_minutes >= 1 AND t.duration_minutes <= 240
    GROUP BY b.borough
    ORDER BY rides DESC
    LIMIT 1
