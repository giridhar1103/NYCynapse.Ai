# Included inside api.giriworks.com's TLS server block. The public address is
# giriworks.com/nycynapse/, served by a Cloudflare Pages Function that forwards here.
location = /nycynapse {
    return 301 /nycynapse/;
}
location /nycynapse/api/ask {
    limit_req zone=nycynapse_ask burst=4 nodelay;
    limit_req_status 429;
    limit_except GET HEAD { deny all; }
    proxy_pass http://127.0.0.1:8031/api/ask;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Client-IP $http_x_client_ip;
    # Answers stream stage by stage; do not hold them back.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 180s;
    proxy_send_timeout 30s;
}
location /nycynapse/ {
    limit_req zone=nycynapse_per_ip burst=40 nodelay;
    limit_conn nycynapse_conn_per_ip 8;
    limit_req_status 429;
    limit_except GET HEAD { deny all; }
    proxy_pass http://127.0.0.1:8031/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Client-IP $http_x_client_ip;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 15s;
}
