location = /nycynapse {
    return 301 /nycynapse/;
}

# Access requests, the owner's admin page and the public MCP server (nycynapse-connect). These
# are the only paths that take form posts or MCP requests, each with its own rate limit.
location /nycynapse/connect {
    limit_req zone=nycynapse_connect burst=10 nodelay;
    limit_req_status 429;
    limit_except GET HEAD POST OPTIONS { deny all; }
    client_max_body_size 32k;
    proxy_pass http://127.0.0.1:8034/connect;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $nyc_client_ip;
    proxy_read_timeout 30s;
}

location /nycynapse/mcp/ {
    limit_req zone=nycynapse_mcp burst=20 nodelay;
    limit_req_status 429;
    limit_except GET HEAD POST DELETE { deny all; }
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:8034/mcp/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $nyc_client_ip;
    proxy_buffering off;
    proxy_read_timeout 120s;
}

location /nycynapse/ {
    limit_req zone=nycynapse_reader burst=40 nodelay;
    limit_conn nycynapse_reader_conn 8;
    limit_req_status 429;
    limit_except GET HEAD { deny all; }
    proxy_pass http://127.0.0.1:8031/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # The reader's address as worked out in the zones file; a caller cannot set it.
    proxy_set_header X-Real-IP $nyc_client_ip;
    proxy_set_header X-Client-IP $nyc_client_ip;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 15s;
}
