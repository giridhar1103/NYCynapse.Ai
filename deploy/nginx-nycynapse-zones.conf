# Who is asking. The public site reaches this server through its own Cloudflare Pages
# function, which passes the reader's address in X-Client-IP. That header is believed only
# when the request really comes from Cloudflare's network and carries that project's worker
# name (set by Cloudflare, not by the caller). Anyone calling this server directly is counted
# by the address they connect from, whatever headers they send.
geo $nyc_from_cf {
    default 0;
    173.245.48.0/20 1; 103.21.244.0/22 1; 103.22.200.0/22 1; 103.31.4.0/22 1;
    141.101.64.0/18 1; 108.162.192.0/18 1; 190.93.240.0/20 1; 188.114.96.0/20 1;
    197.234.240.0/22 1; 198.41.128.0/17 1; 162.158.0.0/15 1; 104.16.0.0/13 1;
    104.24.0.0/14 1; 172.64.0.0/13 1; 131.0.72.0/22 1;
    2400:cb00::/32 1; 2606:4700::/32 1; 2803:f800::/32 1; 2405:b500::/32 1;
    2405:8100::/32 1; 2a06:98c0::/29 1; 2c0f:f248::/32 1;
}
map "$nyc_from_cf:$http_cf_worker" $nyc_reader {
    default $remote_addr;
    "1:giriworkshost.pages.dev" $http_x_client_ip;
}
# A proxied request without the header still gets counted, by the address it came from.
map $nyc_reader $nyc_client_ip {
    default $nyc_reader;
    "" $remote_addr;
}

limit_req_zone $nyc_client_ip zone=nycynapse_reader:1m rate=120r/m;
limit_conn_zone $nyc_client_ip zone=nycynapse_reader_conn:1m;
