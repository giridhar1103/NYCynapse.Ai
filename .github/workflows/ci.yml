name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nyc_app
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: nycynapse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nyc_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NYC_APP_TEST_PG_DSN: dbname=nycynapse_test host=127.0.0.1 user=nyc_app password=ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          PGPASSWORD=ci psql -h 127.0.0.1 -U nyc_app -d nycynapse_test \
            -c "create extension if not exists vector; create extension if not exists pg_trgm;"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: nycynapse check
      - run: pytest -q
