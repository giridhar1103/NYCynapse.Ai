<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalog · NYCynapse</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%232a78d6'/%3E%3Ctext x='16' y='22' font-family='Helvetica,Arial' font-weight='700' font-size='17' fill='white' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="static/style.css?v=4">
</head>
<body>
<main class="wrap">
  <section class="hero">
    <h1>What it knows.</h1>
    <p class="lede">The model never sees raw tables first. It sees this catalog: subject areas, the tables in each, and metrics with fixed definitions. Questions are routed to an area, and metric answers are compiled from these definitions instead of written freehand.</p>
    <p class="hint" id="version"></p>
  </section>
  <section class="block"><h2 class="rule">Areas</h2><div class="boards" id="areas"></div></section>
  <section class="block"><h2 class="rule">Metrics</h2><div id="metrics"></div></section>
</main>
<script src="static/app.js?v=4"></script>
<script>
const { el, get, bullet } = NY;
NY.header("catalog");
(async () => {
  let c;
  try { c = await get("api/catalog"); }
  catch (e) { document.getElementById("areas").replaceChildren(el("div", { class: "error-box" }, e.message)); return; }
  document.getElementById("version").textContent =
    `${c.workspaces.length} areas, ${c.models.length} tables, ${c.metrics.length} metrics, ${c.relationships} join paths. Catalog version ${c.version}.`;
  const byName = Object.fromEntries(c.models.map((m) => [m.name, m]));
  const modelItem = (m) => {
    const info = byName[m];
    return el("li", {}, info ? info.label || m : m, info && info.grain ? el("span", { class: "hint" }, ` · ${info.grain}`) : null);
  };
  document.getElementById("areas").replaceChildren(...c.workspaces.map((w) => el("div", { class: "card board" },
    el("h3", {}, bullet(w.id, true), w.label),
    el("p", { class: "hint", style: "margin:0 0 10px" }, w.description),
    el("ul", { style: "margin:0;padding-left:18px;font-size:14px" }, w.models.map(modelItem)))));
  const area = Object.fromEntries(c.models.map((m) => [m.name, m.workspace]));
  document.getElementById("metrics").replaceChildren(el("div", { class: "table-wrap" }, el("table", { class: "data" },
    el("thead", {}, el("tr", {}, ["", "Metric", "Meaning", "Unit", "Adds up"].map((h) => el("th", {}, h)))),
    el("tbody", {}, c.metrics.map((m) => el("tr", {},
      el("td", {}, bullet(area[m.sources[0]])),
      el("td", {}, el("strong", {}, m.label)),
      el("td", { style: "white-space:normal;min-width:280px" }, m.description),
      el("td", {}, m.unit || ""),
      el("td", {}, m.additivity === "additive" ? "yes" : m.additivity === "semi_additive" ? "not over time" : "no")))))));
})();
</script>
</body>
</html>
