<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data · NYCynapse</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%232a78d6'/%3E%3Ctext x='16' y='22' font-family='Helvetica,Arial' font-weight='700' font-size='17' fill='white' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="static/style.css?v=4">
</head>
<body>
<main class="wrap">
  <section class="hero">
    <h1>The data behind it.</h1>
    <p class="lede">A lakehouse of New York open data, loaded on schedules from minutes to months. Live feeds are polled around the clock. This page reads the lake's own bookkeeping, so a late or broken source shows up here first.</p>
  </section>
  <section class="block"><h2 class="rule">Sources</h2><div id="tables"><span class="hint">Loading…</span></div></section>
  <section class="block"><h2 class="rule">Recent gaps in live feeds</h2><div id="gaps"></div></section>
</main>
<script src="static/app.js?v=4"></script>
<script>
const { el, get, fmt, compact, ago } = NY;
NY.header("data");
const day = (v) => (v ? String(v).slice(0, 10) : "");
(async () => {
  let d;
  try { d = await get("api/freshness"); }
  catch (e) { document.getElementById("tables").replaceChildren(el("div", { class: "error-box" }, e.message)); return; }
  const rows = d.tables.map((t) => el("tr", {},
    el("td", {}, el("span", { class: `status ${t.is_stale ? "stale" : "ok"}` }, t.is_stale ? "Late" : "Fresh")),
    el("td", {}, el("strong", {}, t.table), el("div", { class: "hint" }, t.domain)),
    el("td", {}, t.cadence || ""),
    el("td", {}, t.coverage_start ? `${day(t.coverage_start)} to ${day(t.coverage_end)}` : el("span", { class: "hint" }, "reference table")),
    el("td", { class: "num" }, compact(t.rows)),
    el("td", {}, t.last_success_at ? ago(t.last_success_at) : "")));
  document.getElementById("tables").replaceChildren(el("div", { class: "table-wrap" }, el("table", { class: "data" },
    el("thead", {}, el("tr", {}, ["", "Table", "Loaded", "Covers", "Rows", "Last load"].map((h, i) => el("th", { class: i === 4 ? "num" : null }, h)))),
    el("tbody", {}, rows))));
  const gaps = document.getElementById("gaps");
  if (!d.gaps.length) gaps.append(el("p", { class: "hint" }, "No gaps recorded."));
  else gaps.append(NY.table(["Source", "Feed", "From", "To", "Minutes", "Reason"],
    d.gaps.map((g) => [g.source, g.feed, String(g.start).slice(0, 16), String(g.end).slice(0, 16), g.minutes, g.reason || ""])));
})();
</script>
</body>
</html>
